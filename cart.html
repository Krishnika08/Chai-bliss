<!DOCTYPE html>
<html>

<head>
    <title>Your Cart - Chai Bliss</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">Chai Bliss</div>

        <!-- Navigation menu -->
        <nav class="nav-menu">
            <a href="index.html">Back to Menu</a>
        </nav>
    </header>

    <section class="cart-section">
        <h2>Your Cart</h2>
        <div id="cartItems"></div>
        <h3 id="totalPrice"></h3>

        <div id="cartActions">
            <button onclick="clearCart()" class="clear-btn">
                Clear Cart
            </button>
            <button onclick="checkout()" class="checkout-btn"
                style="background-color: #27ae60; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; margin-top: 15px; margin-left: 10px;">
                Checkout
            </button>
        </div>
    </section>

    <script>
        function renderCart() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            let cartDiv = document.getElementById("cartItems");
            let actionsDiv = document.getElementById("cartActions");
            let totalPrice = document.getElementById("totalPrice");
            let total = 0;

            cartDiv.innerHTML = "";

            if (cart.length === 0) {
                cartDiv.innerHTML = "<p style='color: #777; font-size: 18px; margin-top: 20px;'>Your cart is empty.</p>";
                totalPrice.innerText = "";
                actionsDiv.style.display = "none";
                return;
            }

            actionsDiv.style.display = "block";

            cart.forEach((item, index) => {
                let quantity = item.quantity || 1;
                let itemTotal = item.price * quantity;
                total += itemTotal;

                cartDiv.innerHTML += `
                    <div class="cart-item" style="position: relative; padding-bottom: 20px;">
                        <button onclick="removeItem(${index})" style="position: absolute; top: 10px; right: 10px; background: #e74c3c; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">X</button>
                        <img src="${item.image}" class="cart-img">
                        <h4>${item.name}</h4>
                        <p>₹${item.price}</p>
                        
                        <div style="display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: 15px;">
                            <button onclick="updateQuantity(${index}, -1)" style="padding: 5px 15px; font-size: 18px; background: #C97C5D; color: white; border: none; border-radius: 4px; cursor: pointer;">-</button>
                            <span style="font-size: 18px; font-weight: bold;">${quantity}</span>
                            <button onclick="updateQuantity(${index}, 1)" style="padding: 5px 12px; font-size: 18px; background: #C97C5D; color: white; border: none; border-radius: 4px; cursor: pointer;">+</button>
                        </div>
                        <p style="margin-top: 15px; font-weight: bold; color: #D2691E; font-size: 18px;">Item Total: ₹${itemTotal}</p>
                    </div>
                `;
            });

            totalPrice.innerText = "Grand Total: ₹" + total;
        }

        function updateQuantity(index, change) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            if (cart[index]) {
                cart[index].quantity = (cart[index].quantity || 1) + change;
                if (cart[index].quantity <= 0) {
                    cart.splice(index, 1);
                }
                localStorage.setItem("cart", JSON.stringify(cart));
                renderCart();
            }
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart.splice(index, 1);
            localStorage.setItem("cart", JSON.stringify(cart));
            renderCart();
        }

        function clearCart() {
            localStorage.removeItem("cart");
            renderCart();
        }

        function checkout() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            if (cart.length === 0) return;
            alert("Thank you for your order! This was a demo checkout.");
            clearCart();
        }

        // Initialize cart UI
        renderCart();
    </script>

</body>

</html>
